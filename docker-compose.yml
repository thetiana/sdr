version: '3.9'
services:
  sdr-runtime:
    build:
      context: ./sdr-runtime
    container_name: sdr-runtime
    ports:
      - "8080:8080"
    environment:
      API_BIND: 0.0.0.0
      API_PORT: 8080
      AUTH_TOKEN: ${SDR_API_TOKEN:-change-me}
      CORS_ORIGINS: http://localhost:3000
      SDR_DRIVER: mock-soapysdr
      INITIAL_CENTER_FREQUENCY_HZ: 162400000
      INITIAL_SAMPLE_RATE_HZ: 2400000
      INITIAL_BANDWIDTH_HZ: 2000000
      INITIAL_ANTENNA: RX
      STRICT_CAPABILITY_CHECK: "true"
      RETUNE_POLICY: deny
      MAX_CHANNELS: 32
      MAX_SCANNERS: 8
      MAX_STREAMS: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sdr-webui:
    build:
      context: ./sdr-webui
    container_name: sdr-webui
    depends_on:
      - sdr-runtime
    ports:
      - "3000:3000"
    environment:
      SDR_API_BASE_URL: http://sdr-runtime:8080
      SDR_API_TOKEN: ${SDR_API_TOKEN:-change-me}
      UI_BIND: 0.0.0.0
      UI_PORT: 3000
    restart: unless-stopped
